<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sign in – QuizHub Pro</title>
<link rel="stylesheet" href="site.css">
</head>
<body data-page="signin">
<div class="authwrap">
  <div class="acard">
    <a class="back" href="index.html">← Back to home</a>
    <h1>Welcome back</h1>
    <p class="lead">Sign in to continue your quizzes and keep your scores.</p>
    <form id="loginForm" novalidate>
      <label for="email">Email</label>
      <input type="email" id="email" autocomplete="email" placeholder="you@example.com">
      <div class="err" id="emailErr" aria-live="polite"></div>
      <label for="pw">Password</label>
      <div class="pw"><input type="password" id="pw" autocomplete="current-password" placeholder="Your password"><button type="button" id="t1">Show</button></div>
      <div class="err" id="pwErr" aria-live="polite"></div>
      <button class="btn full" type="submit">Sign in</button>
      <div class="msg" id="msg" aria-live="polite"></div>
    </form>
    <p class="alt-link">New here? <a href="register.html">Create an account</a></p>
  </div>
</div>
<script src="auth.js"></script>
</body>
</html>
