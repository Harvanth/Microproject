<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Register – QuizHub Pro</title>
<link rel="stylesheet" href="site.css">
</head>
<body data-page="register">
<div class="authwrap">
  <div class="acard">
    <a class="back" href="index.html">← Back to home</a>
    <h1>Create your account</h1>
    <p class="lead">It takes less than a minute and it is free.</p>
    <form id="regForm" novalidate>
      <label for="name">Full name</label>
      <input type="text" id="name" autocomplete="name" placeholder="e.g. Priya Sharma" maxlength="40">
      <div class="err" id="nameErr" aria-live="polite"></div>
      <label for="email">Email</label>
      <input type="email" id="email" autocomplete="email" placeholder="you@example.com">
      <div class="err" id="emailErr" aria-live="polite"></div>
      <label for="pw">Password</label>
      <div class="pw"><input type="password" id="pw" autocomplete="new-password" placeholder="At least 8 characters"><button type="button" id="t1">Show</button></div>
      <div class="meter"><i id="bar"></i></div><small id="strength" class="sub"></small>
      <div class="err" id="pwErr" aria-live="polite"></div>
      <label for="pw2">Confirm password</label>
      <div class="pw"><input type="password" id="pw2" autocomplete="new-password" placeholder="Type it again"><button type="button" id="t2">Show</button></div>
      <div class="err" id="pw2Err" aria-live="polite"></div>
      <label class="chk"><input type="checkbox" id="terms"> I agree to the terms and to practise honestly.</label>
      <div class="err" id="termsErr" aria-live="polite"></div>
      <button class="btn full" type="submit">Create account</button>
      <div class="msg" id="msg" aria-live="polite"></div>
    </form>
    <p class="alt-link">Already registered? <a href="signin.html">Sign in</a></p>
  </div>
</div>
<script src="auth.js"></script>
</body>
</html>
